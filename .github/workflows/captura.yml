name: Captura Bronce y pipeline

on:
  schedule:
    # Día 5 de cada mes a las 14:00 UTC (08:00 hora de Colima).
    # DataTur y Banxico publican con rezago mensual; una corrida al mes basta y es respetuosa.
    - cron: "0 14 5 * *"
    # Corrida semanal ligera (lunes) para detectar revisiones retroactivas.
    - cron: "0 14 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write   # necesario para hacer commit de los datos crudos

concurrency:
  group: captura-bronce
  cancel-in-progress: false

jobs:
  capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Pruebas
        run: python -m pytest -q

      - name: Ejecutar extractores
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
        run: python -m src.captura

      - name: Pipeline Plata y Oro (limpieza + Puerta de Calidad)
        run: python -m src.pipeline.ejecutar

      - name: Guardar capas y bitácora
        if: always()
        run: |
          git config user.name  "captura-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bronze data/silver data/gold data/quarantine reports
          if git diff --cached --quiet; then
            echo "Sin cambios en las capas."
          else
            git commit -m "datos: captura y pipeline automáticos $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
